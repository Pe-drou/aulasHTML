<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- palavras chave da página -->
    <meta name="keywords" content="video, audio, metallica, musica">
    <!-- alterando o "favicon" (icone da página) -->
    <link rel="shortcut icon" href="itens/imagens/Metallica.ico" type="image/x-icon">
    <title>Audios e vídeos</title>
</head>
<body>
    <!-- tag de cabeçalho -->
    <header>
        <h1>Exemplo de menu</h1>
        <!-- tag de navegação -->
         <nav>
            <ul>
                <li><a href="itens/imagens/Metallica.jpg" target="_blank">Início</a></li>
                <li><a href="itens/imagens/metallica-kgc.jpg" target="_blank">Galeria</a></li>
                <li><a href="itens/imagens/MetallicaGui.png" target="_blank">Produtos</a></li>
                <li><a href="itens/imagens/metallica-1.jpg" target="_blank">Fale Conosco</a></li>
            </ul>
         </nav>
    </header>
    <hr>
    <!-- tag de conteúdo principal -->
    <main>
        <h2>Vídeos</h2>
        <div>
            <video controls poster="itens/imagens/metallica_ao-vivo.jpg">
                <source src="itens/videos/For Whom the Bell Tolls (Live)-Metallica.mp4">
                <source src="itens/videos/For Whom the Bell Tolls (Live)-Metallica.avi" type="video/avi">
                <source src="itens/videos/For Whom the Bell Tolls (Live)-Metallica.ogv" type="video/ogv">
                <source src="itens/videos/For Whom the Bell Tolls (Live)-Metallica.webm" type="video/webm">
                Seu navegador não suporta vídeos. Faça <a href="itens/videos/For Whom the Bell Tolls (Live)-Metallica.mp4">download</a>!
            </video>
        </div>
        <hr>
        <h2>Áudios</h2>
        <div>
            <div>
                <em>
                    <h3>For whom the bell tolls</h3>
                </em>
                <audio src="itens/audio/For Whom The Bell Tolls - Metallica.mp3" controls></audio>
            </div>
            <div>
                <em>
                    <h3>Master of Puppets</h3>
                </em>
                <audio src="itens/audio/Master of Puppets-Metallica.mp3" controls></audio>
            </div>
            <div>
                <em>
                    <h3>The day that never comes</h3>
                </em>
                <audio src="itens/audio/THE DAY THAT NEVER COMES- METALLICA.mp3" controls></audio>
            </div>
        </div>
    </main>
</body>
</html>
