<!-- atalho para criar o cabeçalho: ! OU html:5 -->
<!DOCTYPE html>
<html lang="pt-br"> <!-- define o idioma de criação da página -->
<head>
    <meta charset="UTF-8"> <!-- permite vizualizar caracteres especiais -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- permite vizualizar o tamanho da tela usada para abrir a página -->
    <title>tablete</title> <!-- título da página -->
</head>
<body>
    <!-- define o local que irá conter a tabela -->
    <table border="3">
        <!-- cria o cabeçalho da tabela -->
        <thead>
            <th>Nome do produto</th>
            <th>Tamanho</th>
            <th>Cor</th>
            <th>Preço</th>
        </thead>
        <!-- cria o conteúdo da tabela -->
        <tbody>
            <td>Camisa</td>
            <td>Ultra XG</td>
            <td>Branca</td>
            <td>R$2000,00</td>
        </tbody>
        <tbody>
            <td>Jaqueta</td>
            <td>M</td>
            <td>Preto</td>
            <td>R$150,00</td>
        </tbody>
        <tbody>
            <td>Calça Jeans</td>
            <td>Nano</td>
            <td>Azul</td>
            <td>R$10,00</td>
        </tbody>
        <tbody>
            <td>Maçã</td>
            <td>Comum</td>
            <td>Azul</td>
            <td>???</td>
        </tbody>
    </table>
</body>
</html>
